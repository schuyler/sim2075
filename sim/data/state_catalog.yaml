# State catalog for the sim2075 compile layer.
#
# GENERATED from the markdown catalogs (methodology/reference/State Entities.md,
# State Variables - Country.md, State Variables - Global.md) by a one-off script;
# re-generate rather than hand-edit when those documents change. The markdown is
# the source of truth; this file is what the compiler validates names against
# (schema validation rule 3) and what sizes the engine's entity/variable axes
# (implementation guide guardrail 7).
#
# derived: true marks variables the engine computes from other variables; they may
# be referenced in expressions but must not be impact targets.
