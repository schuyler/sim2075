name: sim

on:
  push:
    paths: ["sim/**", "events/**", "pyproject.toml", ".github/workflows/sim.yml"]
  pull_request:
    paths: ["sim/**", "events/**", "pyproject.toml", ".github/workflows/sim.yml"]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      # Stage gates (implementation guide §3): E0 fixtures, E1 reference oracle, E2 compiler.
      - run: pytest -q
      # Data-track report: every migrated event compiles; unmigrated files are listed, not failed.
      # Report-only until data-track step D1 lands (three remediation-flagged events currently fail);
      # drop continue-on-error at that point so the compile becomes a blocking gate.
      - run: python -m sim.catalog.cli events
        continue-on-error: true
